function buildFilters(){const all=new Set();DATA.forEach(a=>(a.genres||[]).forEach(g=>all.add(g)));const preferred=["Экшен","Приключения","Фэнтези","Романтика","Комедия","Драма","Психологическое","Ужасы","Сверхъестественное","Спорт","Школа","Фантастика","Повседневность","Триллер","Музыка","Меха"];filters.innerHTML="";["Все",...preferred.filter(x=>all.has(x))].forEach(label=>{const b=document.createElement("button");b.className="filter"+(label==="Все"?" active":"");b.textContent=label;b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");apply(label==="Все"?"all":label)};filters.appendChild(b)})}
